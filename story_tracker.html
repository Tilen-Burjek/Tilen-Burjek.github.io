<!DOCTYPE html>
<html lang="en" data-theme="parchment">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnRPG - Story Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2e8d5; --bg2:#e6d8bc; --card:#ede0c4; --card-hdr:#ddd0a8;
  --border:#b8906a; --border2:#d4b48a; --text:#1c0e08; --muted:#7a5a38; --rule:#c4a46a;
  --num:#7a1010; --good:#0f5020;
  /* card chrome (matches the print sheet) */
  --steel:#3a4a5e; --gold:#6a4a08;
  --t-fast:#8a5a2b; --t-normal:#2f4d7a; --t-slow:#9a2420; --t-react:#1f8f5f; --t-passive:#4a4458; --t-story:#5a4a6a;
  --poised:#3a6a8a; --exhaust:#8a1014; --badge:#5a4a3a;
  --mark-amber:#b3801f; --mark-red:#9a2420;
}
[data-theme="candlelit"]{
  --bg:#1a0d00; --bg2:#251200; --card:#2a1600; --card-hdr:#3a2000;
  --border:#7a4c10; --border2:#5a3808; --text:#f5e6c0; --muted:#c09050; --rule:#6a4010;
  --num:#e07040; --good:#4a8a20;
  --steel:#5a6a7e; --gold:#c8a048;
  --t-fast:#e06820; --t-normal:#5a80c0; --t-slow:#d05a4a; --t-react:#3fbf7f; --t-passive:#8a80a8; --t-story:#a890c0;
  --poised:#5a9ac8; --exhaust:#e05040; --badge:#a89060;
  --mark-amber:#d8a030; --mark-red:#d05040;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'EB Garamond',Georgia,serif;font-size:16px;line-height:1.4}
h1,h2,h3,.head{font-family:'Aref Ruqaa Ink',serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rule)}
.mut{color:var(--muted)} .num{color:var(--num);font-weight:700}
a{color:var(--num);cursor:pointer;text-decoration:underline}

/* ── layout ── */
#loaderr{display:none;margin:2rem auto;max-width:640px;padding:1rem 1.2rem;border:2px solid var(--exhaust);border-radius:8px;background:var(--card)}
#app{display:none}
.partybar{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:2px solid var(--border);
  display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;padding:.5rem .8rem}
.pb-item{display:flex;align-items:center;gap:.35rem;white-space:nowrap}
.pb-item label{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.step{width:22px;height:22px;border:1px solid var(--border);background:var(--card);border-radius:4px;font-weight:700;line-height:1}
.numin{width:3.4em;text-align:center;font-weight:700}
.pips{display:flex;gap:3px} .pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:transparent;padding:0}
.pip.on{background:var(--good);border-color:var(--good)} .pip.over{border-style:dashed}
.markbar{display:flex;gap:2px}
.mseg{width:20px;height:16px;border:1px solid var(--border);background:var(--card);padding:0;border-radius:2px}
.mseg.on0{background:var(--muted)} .mseg.on1{background:var(--muted)} .mseg.on2{background:var(--muted)}
.mseg.on3{background:var(--mark-amber)} .mseg.on4{background:var(--mark-amber)} .mseg.on5{background:var(--mark-red)}
.provtag{font-size:.6rem;background:var(--mark-amber);color:#1c0e08;padding:0 4px;border-radius:3px;letter-spacing:.04em}
.chip-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1px 9px;font-size:.85rem}
.newday{margin-left:auto;background:var(--card-hdr);border:1px solid var(--border);border-radius:5px;padding:4px 12px;font-weight:700}
.tools{display:flex;gap:.4rem;align-items:center}
.tools button{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-size:.8rem}

.players{display:flex;flex-wrap:wrap;gap:.7rem;padding:.7rem .8rem;border-bottom:1px solid var(--rule)}
.pcard{flex:1 1 320px;min-width:300px;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.6rem .7rem}
.pcard h3{margin:.1rem 0 .3rem;display:flex;gap:.4rem;align-items:center}
.pcard h3 input{flex:1;font-family:'Aref Ruqaa Ink',serif;font-size:1.1rem;background:transparent;border:none;border-bottom:1px dotted var(--border)}
.mini{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:.5rem 0 .15rem}
.skchip{display:inline-block;background:var(--card-hdr);border:1px solid var(--border);border-radius:10px;padding:0 7px;margin:1px;font-size:.8rem}
.bioline{display:block;width:100%;font-style:italic;font-size:.82rem;margin:2px 0 5px;background:transparent;border:none;border-bottom:1px dotted var(--border2)}
.cond{display:inline-flex;align-items:center;gap:4px;background:#f5d5d5;color:#6a0a0a;border:1px solid #c04040;border-radius:10px;padding:0 4px 0 8px;margin:2px;font-size:.8rem}
[data-theme="candlelit"] .cond{background:#380808;color:#e08080;border-color:#903030}
.cond.off{opacity:.5;text-decoration:line-through}
.cond .x{border:none;background:none;color:inherit;font-weight:700;padding:0 2px}
.skgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem;font-size:.8rem;margin-top:.2rem}
.skgrid .row{display:flex;justify-content:space-between;border-bottom:1px dotted var(--border2);padding:1px 0}
.skgrid .tr{font-weight:700} .skgrid .plus{color:var(--good);font-weight:700} .skgrid .minus{color:var(--num);font-weight:700}
.tag{font-size:.6rem;background:var(--card-hdr);border:1px solid var(--border);border-radius:3px;padding:0 3px;color:var(--muted)}
.addbtn{background:var(--card-hdr);border:1px solid var(--border);border-radius:5px;padding:1px 8px;font-size:.8rem}
.notesin{width:100%;background:transparent;border:none;border-bottom:1px dotted var(--border);font-size:.85rem}

.tabstrip{display:flex;flex-wrap:wrap;gap:.2rem;padding:.5rem .8rem 0;position:sticky;top:0;background:var(--bg)}
.tabstrip button{background:var(--bg2);border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;padding:5px 12px;font-family:'Aref Ruqaa Ink',serif}
.tabstrip button.active{background:var(--card);font-weight:700}
.panel{padding:1rem 1.1rem;max-width:1200px}
.panel h2{margin:.2rem 0 .6rem;border-bottom:2px solid var(--rule);padding-bottom:.2rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem} @media(max-width:760px){.two{grid-template-columns:1fr}}
.rules-list li{margin:.2rem 0}
table{border-collapse:collapse;width:100%;font-size:.9rem} th,td{border:1px solid var(--border2);padding:4px 7px;text-align:left;vertical-align:top}
th{background:var(--card-hdr)}

/* ── cards (consumables/weapons) - matches the print-sheet look ── */
.cardgrid{display:flex;flex-wrap:wrap;gap:.6rem}
.gcard{width:224px;aspect-ratio:63/88;background:#efe9da;color:#1c0e08;border:1px solid #b0a074;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;font-family:'Aref Ruqaa Ink',serif}
.gitem{width:224px;display:flex;flex-direction:column;gap:3px}
[data-theme="candlelit"] .gcard{background:#efe9da;color:#1c0e08}
.gcard .chead{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#c7bda6;min-height:34px;flex-wrap:wrap}
.gcard .cname{font-size:15px;font-weight:700;color:#2a2622;flex:1;line-height:1.05;min-width:70px}
.tb{width:23px;height:23px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-family:Helvetica,Arial,sans-serif}
.tb.fast{background:#8a5a2b}.tb.normal{background:#2f4d7a}.tb.slow{background:#9a2420}.tb.react{background:#1f8f5f}.tb.passive{background:#4a4458}.tb.any{background:#5a6a2b}.tb.story{background:#5a4a6a}.tb.ondraw{background:#6a4a8a}
.gcard .wbar{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;background:#3a4a5e;color:#c8d8ec;font-family:Helvetica,Arial,sans-serif}
.gcard .wbar.rare{background:#6a4a08;color:#f0d890}
.gcard .wbar.weap{background:#4a3a28;color:#e8d0a8}
.gcard .tgt{font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:4px 8px;color:#ffd9b0;background:#6b3a18;font-family:Helvetica,Arial,sans-serif}
.gcard .tgt.ally{background:#2f5a3a;color:#bff0cf}.gcard .tgt.react{background:#1f6b4a;color:#bff0d8}.gcard .tgt.passive{background:#3a3448;color:#d0c8ec}.gcard .tgt.story{background:#4a3a48;color:#e0cce0}
.gcard .single{flex:1;padding:9px;background:#efe9da;display:flex;align-items:flex-start}
.gcard .seff{font-size:15px;font-weight:600;line-height:1.3;color:#2c2718}
.gcard .seff strong{color:#8a1014;font-size:1.12em;font-weight:800}
.gcard .foot{background:#e0b94a;text-align:center;font-size:10px;font-weight:800;color:#5a4a12;padding:4px;font-family:Helvetica,Arial,sans-serif;letter-spacing:.3px}
.badge{font-size:10px;color:#fff;border-radius:3px;padding:0 4px;margin-left:3px;letter-spacing:.03em;font-family:Helvetica,Arial,sans-serif}
/* skill cards: green category bar; backgrounds: blue band + tag chip bar */
.gcard .catbar{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;background:#2e6e62;color:#cdeee4;font-family:Helvetica,Arial,sans-serif}
.gcard .chead.bgc{background:#3a6ea5}.gcard .chead.bgc .cname{color:#fff}
.gcard .wbar.bgbar{background:#2c537a;color:#cfe0f2}
.gcard .tgt.tag-passive{background:#5a6470;color:#eef1f4}.gcard .tgt.tag-x1{background:#c7a13a;color:#241a04}.gcard .tgt.tag-x2{background:#2f8f5f;color:#e8fff2}.gcard .tgt.tag-trigger{background:#9a5bd0;color:#f3e9ff}.gcard .tgt.tag-cost{background:#b0413a;color:#ffe6e2}
.seff .cnt{color:#2f8f5f;font-weight:800}
.bgchip{display:inline-block;border-radius:10px;padding:1px 8px;font-size:.8rem;font-weight:800;color:#fff}
.bgchip.tag-passive{background:#5a6470}.bgchip.tag-x1{background:#c7a13a;color:#241a04}.bgchip.tag-x2{background:#2f8f5f}.bgchip.tag-trigger{background:#9a5bd0}.bgchip.tag-cost{background:#b0413a}
.gcard.incomplete{opacity:.6}
.inc-badge{background:var(--exhaust);color:#fff;font-size:11px;padding:1px 5px;border-radius:3px;font-family:Helvetica,Arial,sans-serif}
.warnflag{background:var(--mark-amber);color:#1c0e08;font-size:.6rem;padding:0 4px;border-radius:3px}
.owned-wrap{background:var(--bg2);border:1px dashed var(--border);border-radius:8px;padding:.5rem;margin-bottom:.8rem}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.7rem}
.ownctl{display:flex;align-items:center;gap:5px;justify-content:center;padding:4px;border-top:1px solid var(--border2)}
.stockbtn{font-size:.7rem;border:1px solid var(--border);border-radius:4px;padding:1px 6px;background:var(--card)}
.stockbtn.on{background:var(--good);color:#fff;border-color:var(--good)}
.wcard{border:1px solid var(--border);border-radius:8px;padding:.6rem .7rem;margin-bottom:.7rem;background:var(--card)}
.wcard .idl{font-style:italic;color:var(--muted);margin:.1rem 0 .5rem}
.small{font-size:.8rem} details summary{cursor:pointer;font-weight:700}

/* ── readability pass: bigger + heavier + darker-theme contrast ── */
body{font-size:19px;font-weight:600;line-height:1.5}
input,select,textarea,button{font-weight:600}
strong,.num,.skgrid .plus,.skgrid .minus{font-weight:800}
.small{font-size:.98rem}
.mini{font-size:.88rem;font-weight:700}
.pb-item label{font-size:.84rem;font-weight:700}
.tag{font-size:.76rem;font-weight:700}
.skchip{font-size:.95rem;font-weight:700}
.bioline{font-size:.98rem}
.cond{font-size:.95rem;font-weight:700}
.skgrid{font-size:.98rem}
table{font-size:1.02rem} th,td{padding:6px 9px}
.tabstrip button{font-size:1.05rem}
.provtag,.warnflag{font-size:.74rem;font-weight:700}
.numin{font-size:1.1rem}
.chip-btn,.tools button,.stockbtn,.addbtn{font-size:.95rem}
.newday{font-size:1.05rem}
/* darker theme: brighter text, less-black ground, stronger edges */
[data-theme="candlelit"]{--bg:#160c03;--bg2:#241505;--card:#2e1a09;--card-hdr:#412610;--border:#9a6528;--border2:#6a4415;--text:#fbeecb;--muted:#e8c088;--rule:#7a5018}

/* ── print emitter: poker 63×88mm, 3×3 on A4 (dimensions mandatory) ── */
#printview{display:none}
.page{width:189mm;height:264mm;margin:0 auto;display:grid;grid-template-columns:repeat(3,63mm);grid-template-rows:repeat(3,88mm);gap:0;background:#fff;page-break-after:always}
.page:last-child{page-break-after:auto}
.page .pcard{width:63mm;height:88mm;box-sizing:border-box;border:.2mm solid #b0b0b0;background:#efe9da;color:#1c0e08;display:flex;flex-direction:column;overflow:hidden;break-inside:avoid;font-family:'Aref Ruqaa Ink',serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pcard .chead{display:flex;align-items:center;gap:1.6mm;padding:2mm;background:#c7bda6;min-height:9mm;flex-wrap:wrap}
.pcard .cname{font-size:12pt;font-weight:700;color:#2a2622;flex:1;line-height:1.02;min-width:22mm}
.pcard .ptb{width:6mm;height:6mm;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:8.5pt;color:#fff;font-family:Helvetica,Arial,sans-serif}
.pcard .ptb.fast{background:#8a5a2b}.pcard .ptb.normal{background:#2f4d7a}.pcard .ptb.slow{background:#9a2420}.pcard .ptb.react{background:#1f8f5f}.pcard .ptb.passive{background:#4a4458}.pcard .ptb.any{background:#5a6a2b}.pcard .ptb.story{background:#5a4a6a}.pcard .ptb.ondraw{background:#6a4a8a}
.pcard .wbar{font-size:6.5pt;font-weight:800;letter-spacing:.4pt;text-transform:uppercase;padding:1mm 2mm;background:#3a4a5e;color:#c8d8ec;font-family:Helvetica,Arial,sans-serif}
.pcard .wbar.rare{background:#6a4a08;color:#f0d890}.pcard .wbar.weap{background:#4a3a28;color:#e8d0a8}
.pcard .tgt{font-size:8pt;font-weight:800;letter-spacing:.3pt;text-transform:uppercase;padding:1.4mm 2mm;color:#ffd9b0;background:#6b3a18;font-family:Helvetica,Arial,sans-serif}
.pcard .tgt.ally{background:#2f5a3a;color:#bff0cf}.pcard .tgt.react{background:#1f6b4a;color:#bff0d8}.pcard .tgt.passive{background:#3a3448;color:#d0c8ec}.pcard .tgt.story{background:#4a3a48;color:#e0cce0}
.pcard .single{flex:1;padding:2.8mm;background:#efe9da;display:flex;align-items:flex-start}
.pcard .seff{font-size:10.5pt;font-weight:600;line-height:1.3;color:#2c2718}
.pcard .seff.sm{font-size:9pt;line-height:1.24}.pcard .seff.xs{font-size:7.8pt;line-height:1.16}
.pcard .seff strong{color:#8a1014;font-size:1.16em;font-weight:800}
.pcard .foot{background:#e0b94a;text-align:center;font-size:7pt;font-weight:800;color:#5a4a12;padding:1.5mm;font-family:Helvetica,Arial,sans-serif}
.pbadge{font-size:6.5pt;color:#fff;border-radius:1mm;padding:.3mm 1.5mm;font-family:Helvetica,Arial,sans-serif}
/* skill card + background print bars */
.pcard .catbar{font-size:6.5pt;font-weight:800;letter-spacing:.4pt;text-transform:uppercase;padding:1mm 2mm;background:#2e6e62;color:#cdeee4;font-family:Helvetica,Arial,sans-serif}
.pcard .chead.bgc{background:#3a6ea5}.pcard .chead.bgc .cname{color:#fff}
.pcard .wbar.bgbar{background:#2c537a;color:#cfe0f2}
.pcard .tgt.tag-passive{background:#5a6470;color:#eef1f4}.pcard .tgt.tag-x1{background:#c7a13a;color:#241a04}.pcard .tgt.tag-x2{background:#2f8f5f;color:#e8fff2}.pcard .tgt.tag-trigger{background:#9a5bd0;color:#f3e9ff}.pcard .tgt.tag-cost{background:#b0413a;color:#ffe6e2}
@media screen{#printview{display:block;position:fixed;inset:0;background:#888;overflow:auto;z-index:200;padding:8mm}#printview .pbtns button{font-size:1rem;padding:5px 12px}.page{margin:0 auto 6mm;box-shadow:0 2px 14px rgba(0,0,0,.45)}}
@media print{@page{size:A4;margin:9mm}body>*:not(#printview){display:none!important}#printview{display:block!important;background:#fff;padding:0}#printview .pbtns{display:none!important}}
</style>
</head>
<body>

<div id="loaderr"></div>

<div id="app">
  <div class="partybar" id="partybar"></div>
  <div class="players" id="players"></div>
  <div class="tabstrip" id="tabstrip"></div>
  <div id="panel" class="panel"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

/* ── Firebase (separate path from the combat tool - the firewall) ── */
const firebaseConfig = {
  apiKey: "AIzaSyAjxec-sAYiNGBXBZraApfeQCkTWlyvLMg",
  authDomain: "counting-ravens.firebaseapp.com",
  databaseURL: "https://counting-ravens-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "counting-ravens",
  storageBucket: "counting-ravens.firebasestorage.app",
  messagingSenderId: "91930638993",
  appId: "1:91930638993:web:7fd1e4c68547929a441d30"
};
const db = getDatabase(initializeApp(firebaseConfig));
const STATE_REF = ref(db, "anrpg/story");     // party STATE only - card DATA is the seed files
let saveTimer=null, applyingRemote=false;
function saveState(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>set(STATE_REF, S), 400); }
function subscribe(){ onValue(STATE_REF, snap=>{
  const st=snap.val(); if(!st) return;
  if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) { pendingRemote=st; return; }
  applyingRemote=true; S=migrate(st); render(); applyingRemote=false;
}); }
let pendingRemote=null;
document.addEventListener('focusout',()=>{ if(pendingRemote){ S=migrate(pendingRemote); pendingRemote=null; render(); }});

/* ── Card DATA: read-only seeds, loaded separately (needs http - Pages or a local server) ── */
let CONS, WEAP, REF, SKILLS, BG;
async function loadSeeds(){
  const [c,w,r,s,b]=await Promise.all([
    fetch('seed_consumables.json').then(x=>x.json()),
    fetch('seed_weapons.json').then(x=>x.json()),
    fetch('seed_reference.json').then(x=>x.json()),
    fetch('seed_skills.json').then(x=>x.json()),
    fetch('seed_backgrounds.json').then(x=>x.json())
  ]);
  CONS=c; WEAP=w; REF=r; SKILLS=s; BG=b;
}

/* ── Party STATE model ── */
const uid=()=>Math.random().toString(36).slice(2,9);
function blankPlayer(n){ return {id:uid(),name:n||'New Player',trained:['','',''],bios:{},conditions:[],recipes:[],notes:'',backgroundId:''}; }
let S = defaultState();
function defaultState(){ return {
  day:1, dayLabel:'', gold:12, provisions:4, standing:1, mark:0,
  settings:{ standingCap:3 },
  players:[ blankPlayer('Player 1'), blankPlayer('Player 2') ],
  pouch:{ owned:{}, stocked:[] },
  weaponStars:{}, skillStars:{}, bgStars:{}
}; }
function migrate(st){ st=Object.assign(defaultState(),st);
  st.settings=Object.assign({standingCap:3},st.settings||{});
  st.pouch=Object.assign({owned:{},stocked:[]},st.pouch||{});
  st.players=(st.players||[]).map(p=>Object.assign(blankPlayer(),p));
  return st; }

let TAB='camp';
let EDIT_MODE=(localStorage.getItem('anrpg_story_editmode')==='1');
let cardDirty=false;
function markDirty(){ cardDirty=true; }
window.addEventListener('beforeunload',e=>{ if(cardDirty){ e.preventDefault(); e.returnValue=''; } });
function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

/* ── helpers ── */
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bold=(s)=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const skillsList=()=>REF.skills;
const skillName=(id)=>{const s=REF.skills.find(k=>k.id===id);return s?s.name:'';};
const badgeSpan=(b)=>{const col=b==='POISED'?'--poised':b==='EXHAUST'?'--exhaust':'--badge';return `<span class="badge" style="background:var(${col})">${esc(b)}</span>`;};
const itemTimings=(it)=>(it.timings&&it.timings.length)?it.timings:(it.timing?[it.timing]:[]);
const TGLYPH={fast:'⚡',normal:'⬡',slow:'⏳',any:'✶',react:'↩',ondraw:'❈',passive:'✦',story:'✧'};
const cap=(s)=>s?String(s)[0].toUpperCase()+String(s).slice(1):'';
const tb=(t)=>`<span class="tb ${t}">${TGLYPH[t]||'?'}</span>`;
const wbarText=(it)=>it.tier==='rare'?'Rare · Loot Only':('Common · '+(it.discipline==='none'?'Shop':cap(it.discipline)));
function footText(it){ const tms=itemTimings(it); return tms.includes('passive')?'STOCKED ON A PLAYER · AUTO-FIRES':(tms.includes('react')?'CONSUMED · 1 COATING PER ATTACK':'CONSUMED ON USE'); }
function tgtInfo(it){ const tms=itemTimings(it);
  if(tms.includes('passive')) return {cls:'passive',txt:'Passive - Automatic'};
  if(tms.includes('react')) return {cls:'react',txt:'React - '+(it.reactTrigger||String(it.target||'').replace(/^React\s*-\s*/i,'')||'Trigger')};
  const t=it.target||'Enemy';
  if(/story|camp/i.test(t)) return {cls:'story',txt:t};
  if(/self|all(y|ies)/i.test(t)) return {cls:'ally',txt:'Target: '+t};
  return {cls:'',txt:'Target: '+t}; }

/* ── skill card / background helpers (combat-side, browse-only) ── */
const TAGCLS={'PASSIVE':'passive','1x':'x1','2x':'x2','TRIGGER':'trigger','COST':'cost'};
const tagCls=(t)=>TAGCLS[t]||'passive';
function cardTgt(target,timings){ const t=target||'';
  if((timings||[]).includes('react')||/^react|when drawn|when attacked/i.test(t)) return {cls:'react',txt:t||'React'};
  if(/self|all(y|ies)/i.test(t)) return {cls:'ally',txt:t};
  return {cls:'',txt:t||'Enemy'}; }
/* backgrounds: numbers bold-red, but per-combat COUNT words render green (#2f8f5f) */
function bgEffect(txt){
  let s=esc(txt).replace(/\*\*(.+?)\*\*/g,(m,g)=> /^(once|twice|three times|\d+ times)$/i.test(g.trim())?g:`<strong>${g}</strong>`);
  return s.replace(/\b(once|twice|three times|\d+ times)(\s+per combat)/gi,'<span class="cnt">$1</span>$2');
}
function skillCardHTML(sc){ const ti=cardTgt(sc.target,sc.timings);
  return `<div class="gcard">
    <div class="chead">${(sc.timings||[]).map(tb).join('')}<span class="cname">${esc(sc.name)}</span></div>
    <div class="catbar">${esc(sc.category||'')}</div>
    ${sc.target?`<div class="tgt ${ti.cls}">${esc(ti.txt)}</div>`:''}
    <div class="single"><div class="seff${seffSize(sc.effect)}">${bold(sc.effect)} ${(sc.badges||[]).map(badgeSpan).join('')}</div></div></div>`; }
function bgCardHTML(bg){
  return `<div class="gcard">
    <div class="chead bgc"><span class="cname">${esc(bg.name)}</span></div>
    <div class="wbar bgbar">Background</div>
    <div class="tgt tag-${tagCls(bg.tag)}">${esc(bg.tag)}</div>
    <div class="single"><div class="seff${seffSize(bg.effect)}">${bgEffect(bg.effect)}</div></div></div>`; }

/* ══ RENDER ══════════════════════════════════════════════════════════════ */
function render(){ renderPartyBar(); renderPlayers(); renderTabs(); renderPanel(); }

function renderPartyBar(){
  const cap=S.settings.standingCap;
  let pips=''; for(let i=1;i<=Math.max(cap,S.standing);i++) pips+=`<button class="pip ${i<=S.standing?'on':''} ${i>cap?'over':''}" data-standing="${i}"></button>`;
  let mark=''; for(let i=0;i<=5;i++) mark+=`<button class="mseg ${i<=S.mark?'on'+i:''}" data-mark="${i}"></button>`;
  const ownedN=Object.values(S.pouch.owned).filter(n=>n>0).length;
  const bar=`
    <div class="pb-item"><label>Day</label><button class="step" data-day="-1">-</button>
      <input class="numin" style="width:2.6em" value="${S.day}" data-field="day"><button class="step" data-day="1">+</button>
      <input value="${esc(S.dayLabel)}" placeholder="label" data-field="dayLabel" style="width:9em">
    </div>
    <div class="pb-item"><label>Gold</label><button class="step" data-gold="-1">-</button>
      <input class="numin" value="${S.gold}" data-field="gold"><button class="step" data-gold="1">+</button></div>
    <div class="pb-item"><label>Provisions</label><button class="step" data-prov="-1">-</button>
      <input class="numin" value="${S.provisions}" data-field="provisions"><button class="step" data-prov="1">+</button></div>
    <div class="pb-item"><label>Standing</label><div class="pips">${pips}</div></div>
    <div class="pb-item"><label>The Mark</label><div class="markbar">${mark}</div>
      <span class="provtag">PROVISIONAL</span></div>
    <button class="chip-btn" data-goto="pouch">Pouch: ${ownedN} owned - ${S.pouch.stocked.length}/3 stocked</button>
    <button class="newday" id="newday">New day</button>
    <div class="tools">
      <button id="editbtn" style="${EDIT_MODE?'background:var(--good);color:#fff':''}">Edit: ${EDIT_MODE?'ON':'off'}</button>
      <button id="addplayer">+ Player</button>
      <button id="themebtn">Theme</button>
      <button id="printbtn">Print</button>
      <button id="exportbtn">Export</button>
      <button id="resetbtn">Reset</button>
    </div>`;
  const host=document.getElementById('partybar'); host.innerHTML=bar;
  host.querySelectorAll('.step').forEach(b=>b.onclick=()=>{
    if(b.dataset.day) S.day=Math.max(0,S.day+ +b.dataset.day);
    if(b.dataset.gold) S.gold=Math.max(0,S.gold+ +b.dataset.gold);
    if(b.dataset.prov) S.provisions=Math.max(0,S.provisions+ +b.dataset.prov);
    commit(); });
  host.querySelectorAll('[data-field]').forEach(inp=>inp.oninput=()=>{
    const f=inp.dataset.field; S[f]=(f==='dayLabel')?inp.value:Math.max(0,parseInt(inp.value)||0); saveState(); });
  host.querySelectorAll('[data-standing]').forEach(p=>p.onclick=()=>{const v=+p.dataset.standing; S.standing=(S.standing===v?v-1:v); commit();});
  host.querySelectorAll('[data-mark]').forEach(m=>m.onclick=()=>{const v=+m.dataset.mark; S.mark=(S.mark===v?Math.max(0,v-1):v); commit();});
  host.querySelector('[data-goto]').onclick=()=>{TAB='pouch';render();};
  document.getElementById('newday').onclick=newDay;
  document.getElementById('addplayer').onclick=()=>{ if(S.players.length>=4){alert('Max 4 players.');return;} S.players.push(blankPlayer('Player '+(S.players.length+1))); commit(); };
  document.getElementById('themebtn').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='parchment'?'candlelit':'parchment';};
  document.getElementById('exportbtn').onclick=exportImport;
  document.getElementById('resetbtn').onclick=resetAll;
  document.getElementById('editbtn').onclick=toggleEdit;
  document.getElementById('printbtn').onclick=openPrint;
}

function newDay(){
  const n=S.players.length;
  if(!confirm(`New day:\n  Day ${S.day} -> ${S.day+1}\n  Provisions ${S.provisions} -> ${S.provisions-n} (-${n}, one per player)\n\nProceed?`)) return;
  S.day+=1; S.provisions-=n; commit();
}

function renderPlayers(){
  const host=document.getElementById('players'); host.innerHTML='';
  S.players.forEach((p,pi)=>host.appendChild(playerCard(p,pi)));
}
function playerCard(p,pi){
  const opts=(sel)=>`<option value=""${sel?'':' selected'}>- proficiency -</option>`+skillsList().map(k=>`<option value="${k.id}"${sel===k.id?' selected':''}>${esc(k.name)}</option>`).join('');
  // trained skills + bios
  let trained=''; p.trained.forEach((sid,ti)=>{
    trained+=`<div><select data-tr="${ti}">${opts(sid)}</select>`;
    if(sid) trained+=`<input class="bioline" placeholder="how ${esc(p.name)} learned ${esc(skillName(sid))}…" value="${esc(p.bios[sid]||'')}" data-bio="${sid}">`;
    trained+=`</div>`;
  });
  // conditions
  let conds=p.conditions.map(c=>`<span class="cond ${c.active?'':'off'}" data-cid="${c.id}">${esc(c.name)} - ${esc(skillName(c.skill))} -3 <button class="x" data-del="${c.id}">×</button></span>`).join('');
  // effective skill readout
  const condFor=(id)=>p.conditions.some(c=>c.active&&c.skill===id);
  let grid=skillsList().map(k=>{
    const tr=p.trained.includes(k.id), cd=condFor(k.id);
    let mods=''; if(tr) mods+='<span class="plus">+3</span> '; if(cd) mods+='<span class="minus">-3</span> ';
    if(k.passive) mods+='<span class="tag">PASSIVE</span> '; if(k.group) mods+='<span class="tag">GROUP</span>';
    return `<div class="row"><span class="${tr?'tr':''}">${esc(k.name)}</span><span>${mods||'<span class="mut">+0</span>'}</span></div>`;
  }).join('');
  // known recipes
  const recs=(p.recipes||[]).map(rid=>{const r=CONS.recipes.find(x=>x.id===rid);const it=r&&CONS.consumables.find(i=>i.id===r.producesItemId);return it?`<span class="skchip">${esc(it.name)}</span>`:'';}).join('')||'<span class="mut small">none</span>';
  // background (one per character, set-once identity)
  const bgOpts=`<option value="">- background -</option>`+(BG?BG.backgrounds:[]).map(b=>`<option value="${b.id}"${p.backgroundId===b.id?' selected':''}>${esc(b.name)}</option>`).join('');
  const bgSel=BG&&BG.backgrounds.find(b=>b.id===p.backgroundId);
  const bgInfo=bgSel?`<span class="bgchip tag-${tagCls(bgSel.tag)}">${esc(bgSel.name)} · ${esc(bgSel.tag)}</span><div class="small mut" style="margin-top:3px">${bgEffect(bgSel.effect)}</div>`:'';

  const c=el(`<div class="pcard">
    <h3><input value="${esc(p.name)}" data-name="1">${S.players.length>2?'<button class="x" data-rmplayer="1" title="remove">×</button>':''}</h3>
    <div class="mini">Trained proficiencies (+3 each) &amp; how they were learned</div>
    <div data-trained>${trained}</div>
    <div class="mini">Background (one, set once)</div>
    <div data-bgwrap><select data-bg>${bgOpts}</select><div style="margin-top:4px">${bgInfo}</div></div>
    <div class="mini">Conditions</div>
    <div data-conds>${conds||'<span class="mut small">none</span>'} <button class="addbtn" data-addcond="1">+ condition</button></div>
    <details><summary class="mini" style="margin-top:.5rem">Every modifier (all 14 proficiencies)</summary><div class="skgrid">${grid}</div></details>
    <div class="mini">Known recipes</div><div>${recs}</div>
    <div class="mini">Notes</div><input class="notesin" value="${esc(p.notes)}" placeholder="owes the miller 4g; carrying the widow's letter…" data-notes="1">
  </div>`);
  c.querySelector('[data-name]').oninput=e=>{p.name=e.target.value;saveState();};
  const rm=c.querySelector('[data-rmplayer]'); if(rm) rm.onclick=()=>{if(confirm('Remove '+p.name+'?')){S.players.splice(pi,1);commit();}};
  c.querySelectorAll('[data-tr]').forEach(s=>s.onchange=()=>{p.trained[+s.dataset.tr]=s.value;commit();});
  c.querySelector('[data-bg]').onchange=e=>{p.backgroundId=e.target.value;commit();};
  c.querySelectorAll('[data-bio]').forEach(b=>b.oninput=()=>{p.bios[b.dataset.bio]=b.value;saveState();});
  c.querySelector('[data-notes]').oninput=e=>{p.notes=e.target.value;saveState();};
  c.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{p.conditions=p.conditions.filter(cc=>cc.id!==x.dataset.del);commit();});
  c.querySelectorAll('[data-cid]').forEach(chip=>chip.onclick=(ev)=>{if(ev.target.dataset.del)return;const cc=p.conditions.find(x=>x.id===chip.dataset.cid);cc.active=!cc.active;commit();});
  c.querySelector('[data-addcond]').onclick=()=>{
    const name=prompt('Condition name (e.g. Fevered):'); if(!name)return;
    const list=skillsList().map((k,i)=>`${i+1}. ${k.name}`).join('\n');
    const pick=prompt('Dims which proficiency to -3? Enter number:\n'+list); const idx=parseInt(pick)-1;
    if(isNaN(idx)||!skillsList()[idx])return;
    p.conditions.push({id:uid(),name,skill:skillsList()[idx].id,active:true}); commit();
  };
  return c;
}

function renderTabs(){
  const tabs=[['camp','Camp Actions'],['pouch','Consumables & Pouch'],['weapons','Weapons'],['skillcards','Skill Cards'],['backgrounds','Backgrounds'],['recipes','Recipes'],['skills','Proficiencies'],['rules','Rules'],['negotiation','Negotiation & the Twelve']];
  const host=document.getElementById('tabstrip'); host.innerHTML='';
  tabs.forEach(([id,lbl])=>{const b=el(`<button class="${TAB===id?'active':''}">${lbl}</button>`);b.onclick=()=>{TAB=id;renderTabs();renderPanel();};host.appendChild(b);});
}
function renderPanel(){ const p=document.getElementById('panel'); p.innerHTML=''; ({camp:tabCamp,pouch:tabPouch,weapons:tabWeapons,skillcards:tabSkillCards,backgrounds:tabBackgrounds,recipes:tabRecipes,skills:tabSkills,rules:tabRules,negotiation:tabNeg}[TAB])(p); }

/* ── Tab 1: Camp Actions ── */
function tabCamp(p){
  const band=(a)=>a.noRoll?`<em>${esc(a.outcome)}</em>`:(a.outcome?`<em>${esc(a.outcome)}</em>`:`17+ ${esc(a.high||'')} · 10-16 ${esc(a.mid||'')} · 9- ${esc(a.low||'')}`);
  const col=(list)=>`<table><tr><th>Action</th><th>Proficiency</th><th>Outcome</th></tr>`+list.map(a=>{
    if(a.id.startsWith('explore'))return `<tr><td>Explore</td><td>-</td><td><em>1d20 - no proficiency, no modifiers. The GM holds the table.</em></td></tr>`;
    return `<tr><td>${esc(a.name)}</td><td>${esc((a.skills||[]).map(s=>skillName(s)||s).join(', ')||'-')}</td><td>${band(a)}</td></tr>`;}).join('')+`</table>`;
  p.appendChild(el(`<div><h2>Camp Actions</h2>
    <ul class="rules-list small">${REF.campActions.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
    <div class="two"><div><h3>Settlement</h3>${col(REF.campActions.settlement)}</div>
      <div><h3>Wilderness</h3>${col(REF.campActions.wilderness)}</div></div></div>`));
}

/* ── Tab 2: Consumables & Pouch (stateful) ── */
let POUCHFILTER={tier:'',disc:'',timing:'',q:'',owned:false};
function consCard(it,opts={}){
  const stub=!it.effect;
  const tms=itemTimings(it);
  const owned=S.pouch.owned[it.id]||0, stocked=S.pouch.stocked.includes(it.id);
  const ctl=opts.stateful?`<div class="ownctl">
      <button class="step" data-dec="${it.id}">-</button><b>${owned}</b><button class="step" data-inc="${it.id}">+</button>
      ${owned>0&&!stub?`<button class="stockbtn ${stocked?'on':''}" data-stock="${it.id}">${stocked?'stocked':'stock'}</button>`:''}
    </div>`:'';
  const ti=tgtInfo(it);
  const face=`<div class="gcard ${stub?'incomplete':''}">
    <div class="chead">${tms.map(tb).join('')}<span class="cname">${esc(it.name)}</span></div>
    <div class="wbar ${it.tier==='rare'?'rare':''}">${esc(wbarText(it))}</div>
    <div class="tgt ${ti.cls}">${esc(ti.txt)}</div>
    <div class="single">${stub?`<span class="inc-badge">INCOMPLETE - TEXT PENDING</span>`:`<div class="seff">${bold(it.effect)}</div>`}</div>
    <div class="foot">${footText(it)}</div></div>`;
  return opts.stateful?`<div class="gitem">${face}${ctl}</div>`:face;
}
function tabPouch(p){
  if(EDIT_MODE) p.appendChild(consEditorPanel());
  const disc=[...new Set(CONS.consumables.map(c=>c.discipline))];
  const tims=[...new Set(CONS.consumables.flatMap(itemTimings))];
  const wrap=el(`<div><h2>Consumables &amp; Pouch</h2>
    <div class="filters">
      <input id="pq" placeholder="search…" value="${esc(POUCHFILTER.q)}">
      <select id="ptier"><option value="">all tiers</option><option value="common">common</option><option value="rare">rare</option></select>
      <select id="pdisc"><option value="">all disciplines</option>${disc.map(d=>`<option value="${d}">${d}</option>`).join('')}</select>
      <select id="ptim"><option value="">all timings</option>${tims.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
      <label class="small" style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="powned"> owned only</label>
    </div>
    <div class="owned-wrap" id="ownedwrap" style="display:none"><b>Owned</b> <span class="mut small" id="stockcount"></span><div class="cardgrid" id="ownedgrid"></div></div>
    <div class="cardgrid" id="catgrid"></div>
    <p class="small mut">Goods sell at half price - Provisions at face. Rider-React coatings do not stack. Max 3 stocked across the party.</p></div>`);
  p.appendChild(wrap);
  wrap.querySelector('#ptier').value=POUCHFILTER.tier; wrap.querySelector('#pdisc').value=POUCHFILTER.disc; wrap.querySelector('#ptim').value=POUCHFILTER.timing; wrap.querySelector('#powned').checked=POUCHFILTER.owned;
  const match=(it)=>(!POUCHFILTER.tier||it.tier===POUCHFILTER.tier)&&(!POUCHFILTER.disc||it.discipline===POUCHFILTER.disc)&&(!POUCHFILTER.timing||itemTimings(it).includes(POUCHFILTER.timing))&&(!POUCHFILTER.q||it.name.toLowerCase().includes(POUCHFILTER.q.toLowerCase()))&&(!POUCHFILTER.owned||(S.pouch.owned[it.id]||0)>0);
  function attach(){
    wrap.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const id=b.dataset.inc;S.pouch.owned[id]=(S.pouch.owned[id]||0)+1;commit();});
    wrap.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const id=b.dataset.dec;S.pouch.owned[id]=Math.max(0,(S.pouch.owned[id]||0)-1);if(S.pouch.owned[id]===0)S.pouch.stocked=S.pouch.stocked.filter(x=>x!==id);commit();});
    wrap.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>{const id=b.dataset.stock;
      if(S.pouch.stocked.includes(id))S.pouch.stocked=S.pouch.stocked.filter(x=>x!==id);
      else{ if(S.pouch.stocked.length>=3){alert('Only 3 items can be stocked across the party at once. Unstock one first.');return;} S.pouch.stocked.push(id);} commit();});
  }
  function drawGrids(){
    const ownedItems=CONS.consumables.filter(it=>(S.pouch.owned[it.id]||0)>0);
    const ow=wrap.querySelector('#ownedwrap');
    if(ownedItems.length){ ow.style.display=''; wrap.querySelector('#ownedgrid').innerHTML=ownedItems.map(it=>consCard(it,{stateful:true})).join(''); wrap.querySelector('#stockcount').textContent='(stocked '+S.pouch.stocked.length+'/3)'; }
    else ow.style.display='none';
    wrap.querySelector('#catgrid').innerHTML=CONS.consumables.filter(match).map(it=>consCard(it,{stateful:true})).join('');
    attach();
  }
  ['q:pq','tier:ptier','disc:pdisc','timing:ptim'].forEach(m=>{const[k,id]=m.split(':');const e=wrap.querySelector('#'+id);e.oninput=e.onchange=()=>{POUCHFILTER[k]=e.value;drawGrids();};});
  wrap.querySelector('#powned').onchange=e=>{POUCHFILTER.owned=e.target.checked;drawGrids();};
  drawGrids();
}

/* ── Tab 3: Weapons (browse + owned-star) ── */

/* ── Tab: Backgrounds (browse + owned-star; one per character, chosen on the player card) ── */
function tabBackgrounds(p){
  if(EDIT_MODE) p.appendChild(bgEditorPanel());

        <label>Discipline <select id="f-disc">${DISCIPLINES.map(d=>`<option${it.discipline===d?' selected':''}>${d}</option>`).join('')}</select></label><br>
        <label>Target<br><input id="f-target" value="${esc(it.target||'')}" style="width:100%"></label><br>
        <label>Effect (**bold** for numbers)<br><textarea id="f-effect" style="width:100%;height:4em">${esc(it.effect||'')}</textarea></label><br>
        <label>Price <input id="f-price" value="${it.price||0}" style="width:5em"></label>
        <label><input type="checkbox" id="f-craft" ${it.craftable?'checked':''}> craftable</label><br>
        <label>Notes (GM-only, never shown to players)<br><input id="f-notes" value="${esc(it.notes||'')}" style="width:100%"></label>
        <div id="f-warn" class="small" style="color:var(--mark-amber);margin-top:.3rem"></div>
      </div>

    </div>
    <div style="display:flex;gap:.5rem;margin-top:.7rem"><button id="f-save">Save</button><button id="f-cancel">Cancel</button></div></div>`);
  const ov=modal(form); const g=(id)=>form.querySelector('#'+id);
  const collect=()=>{ const tms=[...form.querySelectorAll('.f-tim:checked')].map(x=>x.value); return {id:isNew?slug(g('f-id').value||g('f-name').value):it.id,name:g('f-name').value,timings:tms,timing:tms[0]||'',reactTrigger:g('f-trig').value,tier:g('f-tier').value,discipline:g('f-disc').value,target:g('f-target').value,effect:g('f-effect').value,price:parseInt(g('f-price').value)||0,craftable:g('f-craft').checked,notes:g('f-notes').value}; };
  function refresh(){ const c=collect(); g('f-trigwrap').style.display=c.timings.includes('react')?'':'none';
    g('f-prev').innerHTML=consCard(c,{});
    const w=[]; if(!c.name)w.push('name required'); if(!c.timings.length)w.push('pick at least one timing'); if(!c.effect)w.push('empty effect - renders as INCOMPLETE'); if(c.timings.includes('react')&&!c.reactTrigger)w.push('react card needs a trigger'); if(c.tier==='rare'&&c.craftable&&!recipeFor(c.id))w.push('rare + craftable but no recipe points at it'); if(isNew&&c.id&&CONS.consumables.some(x=>x.id===c.id))w.push('id already exists'); g('f-warn').innerHTML=w.map(esc).join('<br>'); }
  form.querySelectorAll('input,select,textarea').forEach(e=>{ e.oninput=refresh; e.onchange=refresh; });
  g('f-cancel').onclick=()=>ov.remove();
  g('f-save').onclick=()=>{ const c=collect();
    if(!c.name){alert('Name is required.');return;}
    if(!c.id){alert('An id is required.');return;}
    if(isNew&&CONS.consumables.some(x=>x.id===c.id)){alert('That id already exists.');return;}
    if(isNew) CONS.consumables.push(c); else Object.assign(item,c);
    markDirty(); ov.remove(); renderPanel(); };
  refresh();
}
function dupCons(id){ const s=CONS.consumables.find(x=>x.id===id); let base=slug(s.name)+'-copy',nid=base,i=2; while(CONS.consumables.some(x=>x.id===nid)) nid=base+'-'+(i++); const c=JSON.parse(JSON.stringify(s)); c.id=nid; c.name=s.name+' (copy)'; CONS.consumables.push(c); markDirty(); renderPanel(); openConsForm(c); }
function delCons(id){ const s=CONS.consumables.find(x=>x.id===id); if(prompt('Type the item name to delete:\n'+s.name)===s.name){ CONS.consumables=CONS.consumables.filter(x=>x.id!==id); markDirty(); renderPanel(); } }

  window.print();

      <div class="mini">Consumables</div>${CONS.consumables.map(it=>`<label class="small" style="display:block"><input type="checkbox" class="pr-sel" data-t="c" value="${it.id}" ${it.effect?'':'disabled'}> ${esc(it.name)}${it.effect?'':' <span class="mut">(no text - skipped)</span>'}</label>`).join('')}
      <div class="mini">Weapons</div>${WEAP.weapons.map(w=>`<label class="small" style="display:block"><input type="checkbox" class="pr-sel" data-t="w" value="${w.id}"> ${esc(w.name)} (3 cards)</label>`).join('')}
      <div class="mini">Skill cards</div>${SKILLS.skillCards.map(s=>`<label class="small" style="display:block"><input type="checkbox" class="pr-sel" data-t="s" value="${s.id}"> ${esc(s.name)} <span class="mut">${esc(s.category)}</span></label>`).join('')}
      <div class="mini">Backgrounds</div>${BG.backgrounds.map(b=>`<label class="small" style="display:block"><input type="checkbox" class="pr-sel" data-t="b" value="${b.id}"> ${esc(b.name)} <span class="mut">${esc(b.tag)}</span></label>`).join('')}
    </div>
    <button id="pr-selbtn" style="margin-top:.5rem">Print selection</button></div>`);
  modal(box);
  const skipNote=(names)=>{ if(names&&names.length) setTimeout(()=>alert('Skipped - no effect text:\n'+names.join('\n')),150); };
  box.querySelector('#pr-cons').onclick=()=>{ const ok=CONS.consumables.filter(it=>it.effect); printSheet(ok.map(pConsCard)); skipNote(CONS.consumables.filter(it=>!it.effect).map(it=>it.name)); };
  box.querySelector('#pr-weap').onclick=()=>printSheet(WEAP.weapons.flatMap(pWeaponCards));
  box.querySelector('#pr-skill').onclick=()=>printSheet(SKILLS.skillCards.map(pSkillCard));
  box.querySelector('#pr-bg').onclick=()=>printSheet(BG.backgrounds.map(pBgCard));
  box.querySelector('#pr-rec').onclick=()=>printSheet(CONS.recipes.map(pRecipeCard));
  box.querySelector('#pr-selbtn').onclick=()=>{ const sel=[...box.querySelectorAll('.pr-sel:checked')]; let cards=[],skip=[];
    sel.forEach(s=>{ const t=s.dataset.t;
      if(t==='c'){ const it=CONS.consumables.find(i=>i.id===s.value); if(it.effect)cards.push(pConsCard(it)); else skip.push(it.name); }
      else if(t==='w'){ cards.push(...pWeaponCards(WEAP.weapons.find(w=>w.id===s.value))); }
      else if(t==='s'){ cards.push(pSkillCard(SKILLS.skillCards.find(x=>x.id===s.value))); }
      else if(t==='b'){ cards.push(pBgCard(BG.backgrounds.find(x=>x.id===s.value))); } });
    if(!cards.length){ alert('Nothing selected (or only empty-effect items).'); return; } printSheet(cards); skipNote(skip); };
}

/* ── boot ── */
(async function(){
  try{ await loadSeeds(); }
  catch(e){
    document.getElementById('loaderr').style.display='block';
    document.getElementById('loaderr').innerHTML=`<h3>Could not load the seed data</h3>
      <p>This tool reads <code>seed_consumables.json</code>, <code>seed_weapons.json</code> and <code>seed_reference.json</code> from the same folder, and browsers block that when a page is opened directly from disk (<code>file://</code>).</p>
      <p><b>Fix:</b> open it over http - push to GitHub Pages, or run a local server in this folder (e.g. <code>python -m http.server</code>) and visit <code>localhost:8000/story_tracker.html</code>.</p>
      <p class="mut">(${esc(e.message)})</p>`;
    return;
  }
  document.getElementById('app').style.display='block';
  subscribe();          // pulls existing cloud state (and live updates)
  render();             // render defaults immediately; subscribe overwrites if cloud has data
})();
</script>
</body>
